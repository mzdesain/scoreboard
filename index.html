<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBS Scoreboard Pro - V2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;600;700&family=Inter:wght@400;500;600;700;800;900&family=Bebas+Neue&family=Orbitron:wght@500;700;900&family=Oswald:wght@500;700&family=Press+Start+2P&family=Rajdhani:wght@600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    
    <style>
        :root {
            --custom-text-color: #ffffff;
        }

        body {
            background-color: transparent !important;
            font-family: 'Inter', sans-serif;
            user-select: none;
            overflow: hidden;
        }
        
        /* Font Classes */
        .font-teko { font-family: 'Teko', sans-serif !important; }
        .font-bebas { font-family: 'Bebas Neue', sans-serif !important; letter-spacing: 1px; }
        .font-orbitron { font-family: 'Orbitron', sans-serif !important; }
        .font-oswald { font-family: 'Oswald', sans-serif !important; }
        .font-pressstart { font-family: 'Press Start 2P', cursive !important; }
        .font-rajdhani { font-family: 'Rajdhani', sans-serif !important; }
        .font-syne { font-family: 'Syne', sans-serif !important; }

        /* Dynamic Enter/Exit Animation Base */
        #scoreboard-top-wrapper, #scoreboard-bottom-wrapper {
            transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.5s ease;
            will-change: transform, opacity;
        }
        
        /* Animation Type: Slide */
        .anim-type-slide.scoreboard-hidden-top { transform: translateY(-150%); opacity: 0; pointer-events: none; }
        .anim-type-slide.scoreboard-hidden-bottom { transform: translateY(150%); opacity: 0; pointer-events: none; }
        
        /* Animation Type: Fade */
        .anim-type-fade.scoreboard-hidden-top, .anim-type-fade.scoreboard-hidden-bottom { opacity: 0; transform: translateY(0); pointer-events: none; }
        
        /* Animation Type: Scale */
        .anim-type-scale.scoreboard-hidden-top, .anim-type-scale.scoreboard-hidden-bottom { transform: scale(0.8); opacity: 0; pointer-events: none; }

        /* Visible State (Shared) */
        .scoreboard-visible { transform: translate(0) scale(1) !important; opacity: 1 !important; pointer-events: auto; }

        /* Apply Custom Colors */
        .custom-colored-text { color: var(--custom-text-color) !important; }

        /* Elements Animations */
        @keyframes scorePop { 0% { transform: scale(1); } 40% { transform: scale(1.5); color: #f59e0b; } 100% { transform: scale(1); } }
        .anim-score-update { animation: scorePop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

        @keyframes teamGoalFlash { 0% { opacity: 1; } 25% { opacity: 0; } 50% { opacity: 1; color: #fbbf24; } 75% { opacity: 0; } 100% { opacity: 1; } }
        .anim-team-goal { animation: teamGoalFlash 1.5s ease-in-out infinite alternate; }

        @keyframes goalPop {
            0% { transform: translate(-50%, -50%) scale(0.2) skewX(-15deg); opacity: 0; }
            15% { transform: translate(-50%, -50%) scale(1.3) skewX(-15deg); opacity: 1; text-shadow: 0 0 30px #facc15; }
            25% { transform: translate(-50%, -50%) scale(1) skewX(-15deg); opacity: 1; }
            85% { transform: translate(-50%, -50%) scale(1.05) skewX(-15deg); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(0.8) skewX(-15deg); opacity: 0; }
        }
        .animate-goal { animation: goalPop 4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        /* --- PREMIUM THEMES (Upgraded) --- */
        /* Standard */
        body[data-theme="standard"] .scoreboard-main { background: linear-gradient(180deg, #1f2937, #111827); border: 1px solid #374151; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border-radius: 8px; }
        body[data-theme="standard"] .score-panel { background: #000; border-left: 2px solid #374151; border-right: 2px solid #374151; }
        body[data-theme="standard"] .team-panel { background: transparent; }
        
        /* Minimalist */
        body[data-theme="minimalist"] .scoreboard-main { background-color: rgba(10, 10, 10, 0.85); backdrop-filter: blur(8px); border-bottom: 4px solid #fff; border-radius: 0; }
        body[data-theme="minimalist"] .score-panel { border-left: 1px solid rgba(255,255,255,0.1); border-right: 1px solid rgba(255,255,255,0.1); }
        
        /* EPL Style (Premium Modern) */
        body[data-theme="epl"] .scoreboard-main { background: #3d195b; border-radius: 12px; box-shadow: 0 15px 35px rgba(0,0,0,0.6); overflow: visible; }
        body[data-theme="epl"] .score-panel { background: #e90052; margin: 0; border-radius: 0; }
        body[data-theme="epl"] .score-text { color: #fff !important; }
        body[data-theme="epl"] .match-time-text { background: #00ff85; color: #3d195b; padding: 2px 10px; border-radius: 4px; font-weight: 900; }
        body[data-theme="epl"] .stoppage-time-text { background: #3d195b; color: #00ff85; border-radius: 4px; padding: 0 4px; margin-top: -2px; }

        /* UCL Style (Champions) */
        body[data-theme="ucl"] .scoreboard-main { background: linear-gradient(to right, #001235, #002366, #001235); border-top: 2px solid #silver; border-bottom: 2px solid #silver; border-radius: 40px; }
        body[data-theme="ucl"] .score-panel { background: rgba(255,255,255,0.1); backdrop-filter: blur(4px); }
        body[data-theme="ucl"] .match-time-text { color: #fff; border-bottom: 1px solid #silver; }
        body[data-theme="ucl"] .stoppage-time-text { color: #silver; }

        /* Broadcast Clean */
        body[data-theme="broadcast"] .scoreboard-main { background: #0f172a; border-left: 6px solid #3b82f6; border-right: 6px solid #ef4444; border-radius: 4px; }
        body[data-theme="broadcast"] .score-panel { background: linear-gradient(180deg, #1e293b, #020617); }

        /* World Cup */
        body[data-theme="worldcup"] .scoreboard-main { background: #5a0026; border: 2px solid #cfb268; border-radius: 8px; }
        body[data-theme="worldcup"] .score-panel { background: #cfb268; margin: 4px; border-radius: 4px; }
        body[data-theme="worldcup"] .score-text { color: #5a0026 !important; }
        body[data-theme="worldcup"] .match-time-text { color: #cfb268; }

        /* Sportscenter */
        body[data-theme="sportscenter"] .scoreboard-main { background: #111; border-bottom: 6px solid #e11d48; }
        body[data-theme="sportscenter"] .score-panel { background: #222; border-left: 2px solid #333; border-right: 2px solid #333; }
        body[data-theme="sportscenter"] .match-time-text { color: #e11d48; }

        /* Shared Scorer / Stats Sub-panels */
        .scorer-dropdown { transition: all 0.5s ease; max-height: 0; opacity: 0; overflow: hidden; transform-origin: top; }
        .scorer-dropdown.show { max-height: 200px; opacity: 1; }

        /* Controller Layout Styles */
        #main-layout { display: flex; width: 100vw; height: 100vh; overflow: hidden; background: #0a0a0a; }
        .mode-overlay #main-layout { display: block; }
        .mode-overlay #controller-panel { display: none !important; }
        .mode-overlay #preview-panel { background: transparent !important; position: absolute; inset: 0; width: 100vw; height: 100vh; z-index: 10; }
        .mode-mobile #main-layout { flex-direction: column; }
        .mode-mobile #controller-panel { width: 100% !important; max-width: 100%; border: none; }
        .mode-mobile #preview-panel { display: none !important; }

        /* Preview Checkerboard */
        .bg-transparent-grid {
            background-color: #1a1a1a;
            background-image: linear-gradient(45deg, #222 25%, transparent 25%, transparent 75%, #222 75%, #222), linear-gradient(45deg, #222 25%, transparent 25%, transparent 75%, #222 75%, #222);
            background-size: 20px 20px; background-position: 0 0, 10px 10px;
        }

        #preview-scale-wrapper {
            transform: scale(0.65); transform-origin: center center; width: 100%; height: 100%; position: absolute; inset: 0;
            display: flex; flex-direction: column; justify-content: space-between;
        }
        @media (max-width: 1280px) { #preview-scale-wrapper { transform: scale(0.5); } }
        .mode-overlay #preview-scale-wrapper { transform: scale(1) !important; }

        /* Controller Components */
        #controller-panel { background: #0a0a0a; color: #e5e5e5; scrollbar-width: thin; scrollbar-color: #333 #0a0a0a; }
        .ctrl-group { background: #121212; border-radius: 6px; padding: 16px; border: 1px solid #262626; margin-bottom: 16px; }
        .ctrl-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: #888; margin-bottom: 12px; font-weight: 600; }
        .input-pro { background: #171717; border: 1px solid #333; color: #eee; border-radius: 4px; padding: 8px 12px; width: 100%; font-size: 12px; transition: border-color 0.2s; }
        .input-pro:focus { outline: none; border-color: #555; }
        .btn-pro { border-radius: 4px; font-weight: 500; font-size: 12px; transition: all 0.15s; cursor: pointer; padding: 8px 16px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid transparent;}
        .btn-pro:active:not(:disabled) { transform: scale(0.98); }
        .btn-pro:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-outline { background: transparent; color: #e5e5e5; border-color: #333; }
        .btn-outline:hover:not(:disabled) { background: #171717; border-color: #555; }
        .btn-primary { background: #fff; color: #000; }
        .btn-primary:hover:not(:disabled) { background: #e5e5e5; }
        .btn-danger { background: #ef4444; color: #fff; }
        .btn-danger:hover:not(:disabled) { background: #dc2626; }
        .btn-success { background: #10b981; color: #fff; }
        .btn-success:hover:not(:disabled) { background: #059669; }

        /* Huge Goal Alert */
        .goal-alert { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0); opacity: 0; z-index: 9999; text-shadow: 0px 10px 30px rgba(0,0,0,0.8); pointer-events: none; }
    </style>
</head>

<body class="w-screen h-screen overflow-hidden bg-transparent" data-theme="standard" id="app-body">

    <div id="main-layout">
        
        <!-- Controller Side -->
        <div id="controller-panel" class="w-[60%] xl:w-[65%] flex-shrink-0 h-full flex flex-col border-r border-[#262626] z-50 overflow-y-auto relative">
            
            <div class="px-6 py-4 bg-[#0a0a0a]/90 backdrop-blur border-b border-[#262626] flex justify-between items-center sticky top-0 z-20">
                <h3 class="font-bold text-lg text-white flex items-center gap-2">
                    <i class="fas fa-broadcast-tower text-blue-500"></i> OBS Scoreboard Pro V2
                </h3>
                <div class="flex items-center gap-3">
                    <span id="sync-status" class="text-[10px] text-gray-400 font-mono bg-[#171717] px-2 py-1 rounded border border-[#333]"><i class="fas fa-circle-notch fa-spin mr-1"></i> Connecting</span>
                </div>
            </div>

            <div class="p-6 flex-grow space-y-2">
                <!-- Connect & Style -->
                <div class="grid grid-cols-1 xl:grid-cols-2 gap-4">
                    <div class="ctrl-group !mb-0">
                        <div class="ctrl-title"><i class="fas fa-link mr-1"></i> Connection Setup</div>
                        <div class="grid grid-cols-2 gap-3 mb-3">
                            <div>
                                <label class="text-[10px] text-[#888] block mb-1">Room Code</label>
                                <input type="text" id="input-room-code" value="liga-match-v2" onchange="updateRoomCode()" class="input-pro font-mono text-center text-blue-400" placeholder="e.g. room123">
                            </div>
                            <div>
                                <label class="text-[10px] text-[#888] block mb-1">View Mode</label>
                                <select id="mode-selector" onchange="changeMode(this.value)" class="input-pro cursor-pointer">
                                    <option value="combined">Dashboard View</option>
                                    <option value="overlay">OBS Overlay</option>
                                    <option value="mobile">Mobile Remote</option>
                                </select>
                            </div>
                        </div>
                        <div class="flex gap-2">
                            <input type="text" id="obs-link-display" readonly class="input-pro text-[10px] text-gray-500" value="">
                            <button onclick="copyOBSLink(event)" class="btn-pro btn-outline px-3 whitespace-nowrap"><i class="fas fa-copy"></i> Copy</button>
                        </div>
                        <button onclick="requestForceSync()" class="w-full btn-pro btn-outline mt-3 text-blue-400 border-blue-500/30 hover:bg-blue-500/10"><i class="fas fa-sync-alt"></i> Force Sync to OBS</button>
                    </div>

                    <div class="ctrl-group !mb-0">
                        <div class="ctrl-title"><i class="fas fa-paint-brush mr-1"></i> Appearance</div>
                        <div class="flex gap-2 mb-3">
                            <button onclick="toggleView('top')" id="btn-show-top" class="flex-1 btn-pro btn-outline"><i class="fas fa-chevron-up"></i> Top Layout</button>
                            <button onclick="toggleView('bottom')" id="btn-show-bottom" class="flex-1 btn-pro btn-outline"><i class="fas fa-chevron-down"></i> Bottom Layout</button>
                        </div>
                        <div class="grid grid-cols-2 gap-3 mb-3">
                            <div>
                                <label class="text-[10px] text-[#888] block mb-1">Theme</label>
                                <select id="theme-selector" onchange="applyStyles()" class="input-pro cursor-pointer">
                                    <option value="epl">Premier Modern (EPL)</option>
                                    <option value="ucl">Champions (UCL)</option>
                                    <option value="standard">Standard Dark</option>
                                    <option value="minimalist">Minimalist</option>
                                    <option value="broadcast">Broadcast Clean</option>
                                    <option value="worldcup">World Cup</option>
                                    <option value="sportscenter">Sports Red</option>
                                </select>
                            </div>
                            <div>
                                <label class="text-[10px] text-[#888] block mb-1">Font Family</label>
                                <select id="font-selector" onchange="applyStyles()" class="input-pro cursor-pointer">
                                    <option value="font-teko">Teko</option>
                                    <option value="font-inter">Inter</option>
                                    <option value="font-bebas">Bebas Neue</option>
                                    <option value="font-orbitron">Orbitron</option>
                                    <option value="font-oswald">Oswald</option>
                                    <option value="font-rajdhani">Rajdhani</option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="text-[10px] text-[#888] block mb-1">Font Color</label>
                                <input type="color" id="input-text-color" value="#ffffff" onchange="applyStyles()" class="w-full h-8 cursor-pointer rounded border border-[#333] bg-[#171717] p-0.5">
                            </div>
                            <div>
                                <label class="text-[10px] text-[#888] block mb-1">Anim Type</label>
                                <select id="anim-selector" onchange="applyStyles()" class="input-pro cursor-pointer py-1.5 h-8">
                                    <option value="slide">Slide In/Out</option>
                                    <option value="fade">Fade</option>
                                    <option value="scale">Scale & Zoom</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 xl:grid-cols-12 gap-4 pt-2">
                    
                    <!-- Scores -->
                    <div class="ctrl-group xl:col-span-8 !mb-0 flex flex-col">
                        <div class="ctrl-title"><i class="fas fa-futbol mr-1"></i> Match Scores & Names</div>
                        
                        <div class="grid grid-cols-2 gap-4 flex-grow">
                            <!-- HOME -->
                            <div class="bg-[#171717] border border-[#262626] p-3 rounded flex flex-col relative overflow-hidden">
                                <div class="absolute left-0 top-0 bottom-0 w-1 bg-blue-500"></div>
                                <div class="flex gap-2 mb-2">
                                    <input type="text" id="input-home-name" value="HOM" onchange="updateNames()" class="input-pro font-bold uppercase text-center w-1/3" placeholder="Short">
                                    <input type="text" id="input-home-full" value="Home Team" onchange="updateNames()" class="input-pro text-center w-2/3" placeholder="Long Name (Bottom)">
                                </div>
                                <div class="flex gap-2 mb-3">
                                    <button onclick="updateScore('home', -1)" class="btn-pro btn-outline px-3">-1</button>
                                    <button onclick="updateScore('home', 1)" class="btn-pro btn-outline flex-1 border-blue-500/30 hover:border-blue-500 hover:text-blue-400 font-bold"><i class="fas fa-plus mr-1"></i> GOAL</button>
                                </div>
                                <!-- Stats -->
                                <div class="grid grid-cols-3 gap-1 mt-auto">
                                    <div class="flex flex-col items-center">
                                        <span class="text-[9px] text-[#888] mb-1">FOULS</span>
                                        <div class="flex border border-[#333] rounded"><button onclick="updateStat('home','fouls',-1)" class="px-2 py-0.5 hover:bg-[#262626] text-xs">-</button><button onclick="updateStat('home','fouls',1)" class="px-2 py-0.5 border-l border-[#333] hover:bg-[#262626] text-xs">+</button></div>
                                    </div>
                                    <div class="flex flex-col items-center">
                                        <span class="text-[9px] text-yellow-500 mb-1">YELLOW</span>
                                        <div class="flex border border-[#333] rounded"><button onclick="updateStat('home','yellow',-1)" class="px-2 py-0.5 hover:bg-[#262626] text-xs">-</button><button onclick="updateStat('home','yellow',1)" class="px-2 py-0.5 border-l border-[#333] hover:bg-[#262626] text-xs">+</button></div>
                                    </div>
                                    <div class="flex flex-col items-center">
                                        <span class="text-[9px] text-red-500 mb-1">RED</span>
                                        <div class="flex border border-[#333] rounded"><button onclick="updateStat('home','red',-1)" class="px-2 py-0.5 hover:bg-[#262626] text-xs">-</button><button onclick="updateStat('home','red',1)" class="px-2 py-0.5 border-l border-[#333] hover:bg-[#262626] text-xs">+</button></div>
                                    </div>
                                </div>
                            </div>

                            <!-- AWAY -->
                            <div class="bg-[#171717] border border-[#262626] p-3 rounded flex flex-col relative overflow-hidden">
                                <div class="absolute right-0 top-0 bottom-0 w-1 bg-red-500"></div>
                                <div class="flex gap-2 mb-2">
                                    <input type="text" id="input-away-full" value="Away Team" onchange="updateNames()" class="input-pro text-center w-2/3" placeholder="Long Name (Bottom)">
                                    <input type="text" id="input-away-name" value="AWY" onchange="updateNames()" class="input-pro font-bold uppercase text-center w-1/3" placeholder="Short">
                                </div>
                                <div class="flex gap-2 mb-3">
                                    <button onclick="updateScore('away', 1)" class="btn-pro btn-outline flex-1 border-red-500/30 hover:border-red-500 hover:text-red-400 font-bold"><i class="fas fa-plus mr-1"></i> GOAL</button>
                                    <button onclick="updateScore('away', -1)" class="btn-pro btn-outline px-3">-1</button>
                                </div>
                                <!-- Stats -->
                                <div class="grid grid-cols-3 gap-1 mt-auto">
                                    <div class="flex flex-col items-center">
                                        <span class="text-[9px] text-red-500 mb-1">RED</span>
                                        <div class="flex border border-[#333] rounded"><button onclick="updateStat('away','red',-1)" class="px-2 py-0.5 hover:bg-[#262626] text-xs">-</button><button onclick="updateStat('away','red',1)" class="px-2 py-0.5 border-l border-[#333] hover:bg-[#262626] text-xs">+</button></div>
                                    </div>
                                    <div class="flex flex-col items-center">
                                        <span class="text-[9px] text-yellow-500 mb-1">YELLOW</span>
                                        <div class="flex border border-[#333] rounded"><button onclick="updateStat('away','yellow',-1)" class="px-2 py-0.5 hover:bg-[#262626] text-xs">-</button><button onclick="updateStat('away','yellow',1)" class="px-2 py-0.5 border-l border-[#333] hover:bg-[#262626] text-xs">+</button></div>
                                    </div>
                                    <div class="flex flex-col items-center">
                                        <span class="text-[9px] text-[#888] mb-1">FOULS</span>
                                        <div class="flex border border-[#333] rounded"><button onclick="updateStat('away','fouls',-1)" class="px-2 py-0.5 hover:bg-[#262626] text-xs">-</button><button onclick="updateStat('away','fouls',1)" class="px-2 py-0.5 border-l border-[#333] hover:bg-[#262626] text-xs">+</button></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Timer -->
                    <div class="ctrl-group xl:col-span-4 flex flex-col !mb-0">
                        <div class="ctrl-title"><i class="fas fa-clock mr-1"></i> Match Clock</div>
                        
                        <div class="flex justify-center items-center gap-1 mb-3 bg-[#171717] border border-[#262626] rounded py-2">
                            <input type="number" id="input-mins" value="0" class="w-12 text-center text-xl font-mono bg-transparent border-none focus:outline-none text-white p-0" min="0" placeholder="00">
                            <span class="font-bold text-xl text-[#555]">:</span>
                            <input type="number" id="input-secs" value="0" class="w-12 text-center text-xl font-mono bg-transparent border-none focus:outline-none text-white p-0" min="0" max="59" placeholder="00">
                        </div>
                        
                        <div class="grid grid-cols-2 gap-2 mb-3">
                            <select id="timer-dir" class="input-pro text-xs text-center py-1">
                                <option value="up">Count UP</option>
                                <option value="down">Count DOWN</option>
                            </select>
                            <input type="text" id="input-stoppage" value="" class="input-pro text-xs text-center py-1 text-yellow-500" placeholder="+ Extra Time">
                        </div>
                        
                        <div class="flex gap-2 mb-3">
                            <button onclick="applyTimerSettings()" class="flex-1 btn-pro btn-outline py-1.5 text-[10px]">Set</button>
                            <button onclick="resetTimer()" class="flex-1 btn-pro btn-outline py-1.5 text-[10px]"><i class="fas fa-undo"></i> Reset</button>
                        </div>

                        <div class="flex gap-2 mt-auto">
                            <button onclick="startTimer()" id="btn-timer-start" class="flex-1 btn-pro btn-success py-2"><i class="fas fa-play"></i> Start</button>
                            <button onclick="stopTimer()" id="btn-timer-stop" class="flex-1 btn-pro btn-danger py-2" disabled><i class="fas fa-stop"></i> Stop</button>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 pt-2">
                    <div class="ctrl-group !mb-0 border-l-2 border-yellow-500">
                        <div class="ctrl-title"><i class="fas fa-bolt mr-1"></i> Events / Goal Scorer</div>
                        <button onclick="triggerGoalAnimation()" class="w-full btn-pro btn-outline border-yellow-500/30 text-yellow-500 hover:bg-yellow-500/10 py-2.5 mb-3">
                            <i class="fas fa-star mr-1"></i> Trigger GOAL! Banner
                        </button>
                        <div class="flex gap-2 mb-2">
                            <input type="text" id="input-top-scorer-name" placeholder="Player Name" class="input-pro w-2/3">
                            <input type="text" id="input-top-scorer-min" placeholder="Min" class="input-pro w-1/3 text-center">
                        </div>
                        <div class="flex gap-2">
                            <button onclick="triggerTopScorer()" class="flex-1 btn-pro btn-primary py-1.5"><i class="fas fa-eye"></i> Show Event</button>
                            <button onclick="hideTopScorer()" class="btn-pro btn-outline px-3 py-1.5"><i class="fas fa-eye-slash"></i></button>
                        </div>
                    </div>

                    <div class="ctrl-group !mb-0 border-l-2 border-purple-500 flex flex-col">
                        <div class="ctrl-title"><i class="fas fa-list mr-1"></i> Scorers List (Bottom)</div>
                        <div class="flex gap-2 mb-2 flex-grow">
                            <textarea id="input-scorers-home" class="input-pro text-xs h-full resize-none bg-[#171717]" placeholder="Home Scorers..."></textarea>
                            <textarea id="input-scorers-away" class="input-pro text-xs h-full resize-none bg-[#171717] text-right" placeholder="Away Scorers..."></textarea>
                        </div>
                        <button onclick="updateBottomScorers()" class="w-full btn-pro btn-outline py-1.5">Update Scorer List</button>
                    </div>
                </div>

            </div>
        </div>

        <!-- Preview Panel -->
        <div id="preview-panel" class="flex-1 relative bg-transparent-grid overflow-hidden flex items-center justify-center">
            
            <div id="preview-scale-wrapper">
                
                <!-- TOP SCOREBOARD -->
                <div id="overlay-container-top" class="absolute top-8 left-0 w-full flex flex-col items-center pointer-events-none z-30">
                    <div id="scoreboard-top-wrapper" class="scoreboard-hidden-top anim-type-slide w-full flex flex-col items-center justify-center">
                        
                        <div class="scoreboard-main flex items-stretch justify-center transition-all duration-300 w-full max-w-4xl pointer-events-auto relative">
                            <!-- Home -->
                            <div class="team-panel flex-1 text-center py-2 px-6 flex items-center justify-center relative">
                                <div id="top-stats-home" class="absolute left-4 flex gap-1 items-center"></div>
                                <span class="team-name-home custom-colored-text text-4xl font-bold uppercase whitespace-nowrap z-10 tracking-wide">HOM</span>
                            </div>
                            
                            <!-- Middle / Score / Clock -->
                            <div class="score-panel flex items-stretch justify-center px-6 min-w-[220px] relative z-20">
                                <div class="flex items-center justify-center"><span class="score-text custom-colored-text score-home text-5xl font-bold w-12 text-center block">0</span></div>
                                <div class="flex flex-col items-center justify-center mx-4 my-1">
                                    <span class="match-time-text custom-colored-text text-3xl font-bold px-3 rounded tracking-wider leading-none">00:00</span>
                                    <span class="stoppage-time-text text-sm font-bold text-yellow-400 mt-0.5 leading-none hidden">+0</span>
                                </div>
                                <div class="flex items-center justify-center"><span class="score-text custom-colored-text score-away text-5xl font-bold w-12 text-center block">0</span></div>
                            </div>

                            <!-- Away -->
                            <div class="team-panel flex-1 text-center py-2 px-6 flex items-center justify-center relative">
                                <span class="team-name-away custom-colored-text text-4xl font-bold uppercase whitespace-nowrap z-10 tracking-wide">AWY</span>
                                <div id="top-stats-away" class="absolute right-4 flex gap-1 items-center"></div>
                            </div>
                        </div>

                        <!-- Single Event Dropdown -->
                        <div id="scorer-info-top" class="scorer-dropdown w-full max-w-4xl flex justify-center pointer-events-auto">
                            <div class="bg-black/80 backdrop-blur text-white px-8 py-2 rounded-b border border-t-0 border-white/10 shadow-lg flex items-center gap-3">
                                <i class="fas fa-futbol text-white"></i>
                                <span id="top-scorer-name" class="text-2xl font-bold uppercase tracking-wide custom-colored-text">Player</span>
                                <span class="text-gray-500 text-xl">|</span>
                                <span id="top-scorer-time" class="text-xl font-bold text-yellow-400">45'</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- BOTTOM SCOREBOARD -->
                <div id="overlay-container-bottom" class="absolute bottom-12 left-0 w-full flex flex-col items-center pointer-events-none z-40">
                    <div id="scoreboard-bottom-wrapper" class="scoreboard-hidden-bottom anim-type-slide w-[92%] max-w-7xl flex flex-col items-center justify-center">
                        
                        <!-- Main Bottom Bar -->
                        <div class="scoreboard-main flex items-stretch justify-center transition-all duration-300 w-full pointer-events-auto relative">
                            <!-- Home -->
                            <div class="team-panel flex-1 text-center py-2 px-8 flex items-center justify-end relative">
                                <div id="btm-stats-home" class="absolute left-6 flex gap-1 items-center"></div>
                                <span class="team-name-home-full custom-colored-text text-4xl font-bold uppercase whitespace-nowrap z-10 tracking-wide text-right">Home Team</span>
                            </div>
                            
                            <!-- Middle / Score / Clock -->
                            <div class="score-panel flex items-stretch justify-center px-6 min-w-[240px] relative z-20">
                                <div class="flex items-center justify-center"><span class="score-text custom-colored-text score-home text-5xl font-bold w-14 text-center block">0</span></div>
                                <div class="flex flex-col items-center justify-center mx-4 my-1">
                                    <span class="match-time-text custom-colored-text text-3xl font-bold px-3 rounded tracking-wider leading-none">00:00</span>
                                    <span class="stoppage-time-text text-sm font-bold text-yellow-400 mt-0.5 leading-none hidden">+0</span>
                                </div>
                                <div class="flex items-center justify-center"><span class="score-text custom-colored-text score-away text-5xl font-bold w-14 text-center block">0</span></div>
                            </div>

                            <!-- Away -->
                            <div class="team-panel flex-1 text-center py-2 px-8 flex items-center justify-start relative">
                                <span class="team-name-away-full custom-colored-text text-4xl font-bold uppercase whitespace-nowrap z-10 tracking-wide text-left">Away Team</span>
                                <div id="btm-stats-away" class="absolute right-6 flex gap-1 items-center"></div>
                            </div>
                        </div>

                        <!-- Bottom Multiline Scorers (Dropdown) -->
                        <div id="btm-scorers-panel" class="scorer-dropdown w-full flex justify-between pointer-events-auto">
                            <div class="flex-1 flex justify-end pr-2">
                                <div id="btm-scorers-home" class="custom-colored-text text-xl bg-black/80 backdrop-blur px-6 py-3 border-l-4 border-blue-500 rounded-bl-lg shadow-lg whitespace-pre-line text-right empty:hidden leading-snug"></div>
                            </div>
                            <!-- Spacer for middle panel alignment -->
                            <div class="min-w-[240px]"></div> 
                            <div class="flex-1 flex justify-start pl-2">
                                <div id="btm-scorers-away" class="custom-colored-text text-xl bg-black/80 backdrop-blur px-6 py-3 border-r-4 border-red-500 rounded-br-lg shadow-lg whitespace-pre-line text-left empty:hidden leading-snug"></div>
                            </div>
                        </div>
                        
                    </div>
                </div>

                <!-- HUGE GOAL ALERT -->
                <div id="goal-alert" class="goal-alert">
                    <h1 class="text-[12rem] font-black text-white uppercase italic leading-none">GOAL<span class="text-yellow-400">!</span></h1>
                </div>

            </div>
        </div>
    </div>

    <script>
        window.appState = {
            scores: { home: 0, away: 0 },
            teamNames: { home: 'HOM', away: 'AWY' },
            fullTeamNames: { home: 'Home Team', away: 'Away Team' },
            stats: { home: { fouls: 0, yellow: 0, red: 0 }, away: { fouls: 0, yellow: 0, red: 0 } },
            activeView: 'none',
            theme: 'epl',
            font: 'font-teko',
            customColor: '#ffffff',
            animation: 'slide',
            timer: { seconds: 0, isRunning: false, direction: 'up', stoppage: '' },
            topScorer: { name: '', min: '', visible: false },
            bottomScorers: { home: '', away: '', visible: false },
            goalEvent: { active: false, team: null, timestamp: 0 }
        };

        const urlParams = new URLSearchParams(window.location.search);
        let roomCode = urlParams.get('room') || 'liga-match-v2';
        let timerInterval = null;
        let mqttClient = null;
        let isMQTTActive = false;
        let bc = null; // BroadcastChannel for local/Canvas sync

        function inIframe() {
            try { return window.self !== window.top; } catch (e) { return true; }
        }

        function initSync() {
            // 1. Initialize BroadcastChannel (Local sync for Canvas/Tabs)
            try {
                bc = new BroadcastChannel('obs_score_channel_' + roomCode);
                bc.onmessage = (event) => {
                    if (event.data.type === 'state') {
                        applyRemoteState(event.data.payload);
                    } else if (event.data.type === 'request') {
                        if (!document.body.classList.contains('mode-overlay')) {
                            bc.postMessage({ type: 'state', payload: window.appState });
                        }
                    }
                };
                if (document.body.classList.contains('mode-overlay')) {
                    bc.postMessage({ type: 'request' });
                }
            } catch (e) { console.warn("BroadcastChannel not supported"); }

            // 2. Initialize MQTT (Remote sync for OBS) - ONLY if not in Canvas/Iframe
            if (!inIframe()) {
                initMQTT();
            } else {
                document.getElementById('sync-status').innerHTML = '<i class="fas fa-satellite-dish text-yellow-500 mr-1"></i> Local Sync (Canvas)';
                console.log("Canvas preview detected: MQTT disabled to prevent CSP errors. Using Local BroadcastChannel instead.");
            }
        }

        function initMQTT() {
            try {
                mqttClient = mqtt.connect('wss://broker.emqx.io:8084/mqtt');
                mqttClient.on('connect', () => {
                    isMQTTActive = true;
                    document.getElementById('sync-status').innerHTML = '<i class="fas fa-check-circle text-green-500 mr-1"></i> Online';
                    
                    // Subscribe to state topic
                    mqttClient.subscribe('obs-score-v2/state/' + roomCode);
                    
                    const isOverlay = document.body.classList.contains('mode-overlay');
                    if (isOverlay) {
                        // If I am OBS, tell the controller I need the state immediately
                        mqttClient.publish('obs-score-v2/request/' + roomCode, 'sync_me');
                    } else {
                        // If I am Controller, listen for OBS requests
                        mqttClient.subscribe('obs-score-v2/request/' + roomCode);
                        // Also push current state initially
                        syncState();
                    }
                });

                mqttClient.on('message', (topic, message) => {
                    const msgStr = message.toString();
                    if (topic.includes('/request/')) {
                        // OBS is asking for data, send it (only controller responds)
                        if (!document.body.classList.contains('mode-overlay')) {
                            syncState();
                        }
                    } else if (topic.includes('/state/')) {
                        try {
                            const newState = JSON.parse(msgStr);
                            applyRemoteState(newState);
                        } catch(e) {}
                    }
                });
            } catch (err) {
                console.error("MQTT Error", err);
            }
        }

        window.updateRoomCode = function() {
            const oldRoom = roomCode;
            roomCode = document.getElementById('input-room-code').value.trim() || 'liga-match-v2';
            window.generateOBSLink();
            
            if (bc) {
                bc.close();
                initSync(); // Re-init channels with new room code
            } else {
                initSync();
            }

            if (isMQTTActive && mqttClient) {
                mqttClient.unsubscribe('obs-score-v2/state/' + oldRoom);
                mqttClient.unsubscribe('obs-score-v2/request/' + oldRoom);
                
                mqttClient.subscribe('obs-score-v2/state/' + roomCode);
                if (!document.body.classList.contains('mode-overlay')) {
                    mqttClient.subscribe('obs-score-v2/request/' + roomCode);
                }
                syncState();
            }
        };

        window.requestForceSync = function() {
            syncState(null, true);
        };

        window.syncState = function(triggerGoalForTeam = null, force = false) {
            if (document.body.classList.contains('mode-overlay')) return;
            if (triggerGoalForTeam) window.appState.goalEvent = { active: true, team: triggerGoalForTeam, timestamp: Date.now() };
            
            try { localStorage.setItem('obs_score_v2_' + roomCode, JSON.stringify(window.appState)); } catch(e) {}
            
            if (bc) {
                bc.postMessage({ type: 'state', payload: window.appState });
            }

            if (isMQTTActive && mqttClient) {
                // Publish with retained flag so new clients get it immediately
                mqttClient.publish('obs-score-v2/state/' + roomCode, JSON.stringify(window.appState), { retain: true, qos: 1 });
            }
        };

        function applyRemoteState(newState) {
            const oldGoalTimestamp = window.appState.goalEvent?.timestamp || 0;
            window.appState = { ...newState };

            // Update inputs if we are in controller mode
            if (!document.body.classList.contains('mode-overlay')) {
                document.getElementById('input-home-name').value = window.appState.teamNames.home;
                document.getElementById('input-away-name').value = window.appState.teamNames.away;
                document.getElementById('input-home-full').value = window.appState.fullTeamNames?.home || '';
                document.getElementById('input-away-full').value = window.appState.fullTeamNames?.away || '';
                document.getElementById('theme-selector').value = window.appState.theme;
                document.getElementById('font-selector').value = window.appState.font;
                document.getElementById('input-text-color').value = window.appState.customColor || '#ffffff';
                document.getElementById('anim-selector').value = window.appState.animation || 'slide';
                document.getElementById('input-scorers-home').value = window.appState.bottomScorers?.home || '';
                document.getElementById('input-scorers-away').value = window.appState.bottomScorers?.away || '';
                
                if (!window.appState.timer.isRunning) {
                    document.getElementById('input-mins').value = Math.floor((window.appState.timer?.seconds || 0) / 60);
                    document.getElementById('input-secs').value = (window.appState.timer?.seconds || 0) % 60;
                }
                document.getElementById('input-stoppage').value = window.appState.timer.stoppage || '';
                document.getElementById('timer-dir').value = window.appState.timer.direction || 'up';
            }

            renderDOM();
            updateTimerRunningState();

            // Trigger goal animation if it's new
            if (newState.goalEvent && newState.goalEvent.timestamp > oldGoalTimestamp && oldGoalTimestamp !== 0) {
                triggerGoalEffects(newState.goalEvent.team);
            }
        }

        window.generateOBSLink = function() {
            const url = new URL(window.location.href);
            url.searchParams.set('mode', 'overlay');
            url.searchParams.set('room', document.getElementById('input-room-code').value || 'liga-match-v2');
            document.getElementById('obs-link-display').value = url.href;
        };

        window.copyOBSLink = function(event) {
            const link = document.getElementById('obs-link-display').value;
            const textArea = document.createElement("textarea");
            textArea.value = link; document.body.appendChild(textArea); textArea.select();
            try {
                document.execCommand('copy');
                const btn = event.target; const oldHTML = btn.innerHTML;
                btn.innerHTML = '<i class="fas fa-check"></i> Copied!';
                setTimeout(() => btn.innerHTML = oldHTML, 2000);
            } catch (err) {}
            document.body.removeChild(textArea);
        };

        function changeMode(mode) {
            document.body.classList.remove('mode-overlay', 'mode-mobile');
            if (mode === 'overlay') document.body.classList.add('mode-overlay');
            if (mode === 'mobile') document.body.classList.add('mode-mobile');
        }

        function toggleView(view) {
            window.appState.activeView = (window.appState.activeView === view) ? 'none' : view;
            if (window.appState.activeView !== 'top') window.appState.topScorer.visible = false;
            
            const btnTop = document.getElementById('btn-show-top');
            const btnBtm = document.getElementById('btn-show-bottom');
            if(btnTop) btnTop.className = window.appState.activeView === 'top' ? 'flex-1 btn-pro btn-primary' : 'flex-1 btn-pro btn-outline';
            if(btnBtm) btnBtm.className = window.appState.activeView === 'bottom' ? 'flex-1 btn-pro btn-primary' : 'flex-1 btn-pro btn-outline';
            
            renderDOM(); syncState();
        }

        function renderDOM() {
            const state = window.appState;
            const wrapperTop = document.getElementById('scoreboard-top-wrapper');
            const wrapperBtm = document.getElementById('scoreboard-bottom-wrapper');

            // Apply Theme & CSS Variables
            document.getElementById('app-body').setAttribute('data-theme', state.theme);
            document.documentElement.style.setProperty('--custom-text-color', state.customColor || '#ffffff');
            
            // Fonts
            document.querySelectorAll('.scoreboard-main, .scorer-dropdown').forEach(el => {
                el.className = el.className.replace(/font-\w+/g, ''); 
                el.classList.add(state.font);
            });

            // Set Animation Classes base on state.animation
            const animTypeClass = `anim-type-${state.animation || 'slide'}`;
            wrapperTop.className = wrapperTop.className.replace(/anim-type-\w+/g, '');
            wrapperTop.classList.add(animTypeClass);
            wrapperBtm.className = wrapperBtm.className.replace(/anim-type-\w+/g, '');
            wrapperBtm.classList.add(animTypeClass);

            // View toggling logic (Show/Hide)
            if (state.activeView === 'top') {
                wrapperBtm.classList.remove('scoreboard-visible');
                wrapperBtm.classList.add('scoreboard-hidden-bottom');
                setTimeout(() => {
                    wrapperTop.classList.remove('scoreboard-hidden-top');
                    wrapperTop.classList.add('scoreboard-visible');
                }, 50);
            } else if (state.activeView === 'bottom') {
                wrapperTop.classList.remove('scoreboard-visible');
                wrapperTop.classList.add('scoreboard-hidden-top');
                setTimeout(() => {
                    wrapperBtm.classList.remove('scoreboard-hidden-bottom');
                    wrapperBtm.classList.add('scoreboard-visible');
                }, 50);
            } else {
                wrapperTop.classList.remove('scoreboard-visible');
                wrapperTop.classList.add('scoreboard-hidden-top');
                wrapperBtm.classList.remove('scoreboard-visible');
                wrapperBtm.classList.add('scoreboard-hidden-bottom');
            }

            // Names & Scores
            if (!window.isHomeGoalAnimating) {
                document.querySelectorAll('.team-name-home').forEach(el => el.textContent = state.teamNames.home);
                document.querySelectorAll('.team-name-home-full').forEach(el => el.textContent = state.fullTeamNames?.home || state.teamNames.home);
            }
            if (!window.isAwayGoalAnimating) {
                document.querySelectorAll('.team-name-away').forEach(el => el.textContent = state.teamNames.away);
                document.querySelectorAll('.team-name-away-full').forEach(el => el.textContent = state.fullTeamNames?.away || state.teamNames.away);
            }
            document.querySelectorAll('.score-home').forEach(el => el.textContent = state.scores.home);
            document.querySelectorAll('.score-away').forEach(el => el.textContent = state.scores.away);
            
            // Timer & Stoppage
            document.querySelectorAll('.match-time-text').forEach(el => el.textContent = formatTime(state.timer.seconds));
            document.querySelectorAll('.stoppage-time-text').forEach(el => {
                if (state.timer.stoppage && state.timer.stoppage.trim() !== '') {
                    el.textContent = state.timer.stoppage; el.classList.remove('hidden');
                } else { el.classList.add('hidden'); }
            });

            // Scorers logic
            document.getElementById('top-scorer-name').textContent = state.topScorer.name;
            document.getElementById('top-scorer-time').textContent = state.topScorer.min;
            if (state.activeView === 'top' && state.topScorer.visible) {
                document.getElementById('scorer-info-top').classList.add('show');
            } else {
                document.getElementById('scorer-info-top').classList.remove('show');
            }
            
            document.getElementById('btm-scorers-home').innerText = state.bottomScorers?.home || '';
            document.getElementById('btm-scorers-away').innerText = state.bottomScorers?.away || '';
            const btmScorersPanel = document.getElementById('btm-scorers-panel');
            if (state.activeView === 'bottom' && state.bottomScorers.visible && ((state.bottomScorers?.home || '').trim() !== '' || (state.bottomScorers?.away || '').trim() !== '')) {
                btmScorersPanel.classList.add('show');
            } else {
                btmScorersPanel.classList.remove('show');
            }

            // Cards & Fouls Render
            const createCardHTML = (color, count) => {
                let html = '';
                const bgClass = color === 'yellow' ? 'bg-yellow-400' : 'bg-red-600';
                for(let i = 0; i < count; i++) html += `<div class="w-3 h-4.5 ${bgClass} rounded-sm border border-black/50 shadow-md inline-block mr-0.5"></div>`;
                return html;
            };

            const homeStatsHTML = `${state.stats.home.fouls > 0 ? `<span class="text-[11px] font-bold bg-white/10 text-white border border-white/20 px-1.5 rounded shadow mr-1">F: ${state.stats.home.fouls}</span>` : ''} ${createCardHTML('yellow', state.stats.home.yellow)} ${createCardHTML('red', state.stats.home.red)}`;
            const awayStatsHTML = `${createCardHTML('red', state.stats.away.red)} ${createCardHTML('yellow', state.stats.away.yellow)} ${state.stats.away.fouls > 0 ? `<span class="text-[11px] font-bold bg-white/10 text-white border border-white/20 px-1.5 rounded shadow ml-1">F: ${state.stats.away.fouls}</span>` : ''}`;

            document.getElementById('top-stats-home').innerHTML = homeStatsHTML;
            document.getElementById('top-stats-away').innerHTML = awayStatsHTML;
            document.getElementById('btm-stats-home').innerHTML = homeStatsHTML;
            document.getElementById('btm-stats-away').innerHTML = awayStatsHTML;
        }

        function updateStat(team, type, change) {
            window.appState.stats[team][type] = Math.max(0, window.appState.stats[team][type] + change);
            renderDOM(); syncState();
        }

        function updateScore(team, change) {
            window.appState.scores[team] = Math.max(0, window.appState.scores[team] + change);
            renderDOM();
            if (change > 0) { triggerGoalEffects(team); syncState(team); } else syncState();
        }

        function triggerGoalEffects(team) {
            triggerGoalAnimation();
            document.querySelectorAll(`.score-${team}`).forEach(el => { el.classList.remove('anim-score-update'); void el.offsetWidth; el.classList.add('anim-score-update'); });
            
            if (team === 'home') window.isHomeGoalAnimating = true;
            if (team === 'away') window.isAwayGoalAnimating = true;

            document.querySelectorAll(`.team-name-${team}, .team-name-${team}-full`).forEach(el => {
                el.textContent = "GOAL!"; el.classList.add('anim-team-goal');
            });

            setTimeout(() => {
                if (team === 'home') window.isHomeGoalAnimating = false;
                if (team === 'away') window.isAwayGoalAnimating = false;
                
                document.querySelectorAll(`.team-name-${team}`).forEach(el => {
                    el.classList.remove('anim-team-goal');
                    el.textContent = window.appState.teamNames[team];
                });
                document.querySelectorAll(`.team-name-${team}-full`).forEach(el => {
                    el.classList.remove('anim-team-goal');
                    el.textContent = window.appState.fullTeamNames?.[team] || window.appState.teamNames[team];
                });
            }, 3000);
        }

        function triggerGoalAnimation() {
            const elGoal = document.getElementById('goal-alert');
            elGoal.classList.remove('animate-goal'); void elGoal.offsetWidth; elGoal.classList.add('animate-goal');
        }

        function updateNames() {
            window.appState.teamNames.home = document.getElementById('input-home-name').value || "HOM";
            window.appState.teamNames.away = document.getElementById('input-away-name').value || "AWY";
            window.appState.fullTeamNames.home = document.getElementById('input-home-full').value;
            window.appState.fullTeamNames.away = document.getElementById('input-away-full').value;
            renderDOM(); syncState();
        }

        function applyStyles() {
            window.appState.theme = document.getElementById('theme-selector').value;
            window.appState.font = document.getElementById('font-selector').value;
            window.appState.customColor = document.getElementById('input-text-color').value;
            window.appState.animation = document.getElementById('anim-selector').value;
            renderDOM(); syncState();
        }

        function triggerTopScorer() {
            let minute = document.getElementById('input-top-scorer-min').value.trim();
            if (minute !== "" && !minute.includes("'")) minute += "'";
            window.appState.topScorer = { name: document.getElementById('input-top-scorer-name').value.trim() || "Player", min: minute, visible: true };
            if (window.appState.activeView === 'none') window.appState.activeView = 'top';
            renderDOM(); syncState();
            setTimeout(() => hideTopScorer(true), 8000);
        }

        function hideTopScorer(doSync = true) {
            window.appState.topScorer.visible = false; renderDOM(); if (doSync) syncState();
        }

        function updateBottomScorers() {
            const h = document.getElementById('input-scorers-home').value.trim();
            const a = document.getElementById('input-scorers-away').value.trim();
            window.appState.bottomScorers = { home: h, away: a, visible: (h !== '' || a !== '') };
            if (window.appState.activeView === 'none') window.appState.activeView = 'bottom';
            renderDOM(); syncState();
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        function updateTimerRunningState() {
            const btnStart = document.getElementById('btn-timer-start');
            const btnStop = document.getElementById('btn-timer-stop');
            if (window.appState.timer.isRunning) {
                if (btnStart) btnStart.disabled = true;
                if (btnStop) btnStop.disabled = false;
                if (!timerInterval) {
                    timerInterval = setInterval(() => {
                        window.appState.timer.direction === 'up' ? window.appState.timer.seconds++ : window.appState.timer.seconds--;
                        if (window.appState.timer.seconds <= 0) { window.appState.timer.seconds = 0; stopTimer(); }
                        renderDOM();
                    }, 1000);
                }
            } else {
                if (btnStart) btnStart.disabled = false;
                if (btnStop) btnStop.disabled = true;
                if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
            }
        }

        function applyTimerSettings() {
            window.appState.timer.direction = document.getElementById('timer-dir').value;
            window.appState.timer.seconds = ((parseInt(document.getElementById('input-mins').value) || 0) * 60) + (parseInt(document.getElementById('input-secs').value) || 0);
            window.appState.timer.stoppage = document.getElementById('input-stoppage').value;
            renderDOM(); syncState();
        }

        function resetTimer() {
            stopTimer();
            window.appState.timer.seconds = 0; window.appState.timer.stoppage = '';
            document.getElementById('input-mins').value = 0; document.getElementById('input-secs').value = 0; document.getElementById('input-stoppage').value = '';
            renderDOM(); syncState();
        }

        function startTimer() {
            if (!window.appState.timer.isRunning) {
                window.appState.timer.isRunning = true;
                window.appState.timer.direction = document.getElementById('timer-dir').value;
                updateTimerRunningState(); syncState();
            }
        }

        function stopTimer() {
            if (window.appState.timer.isRunning) {
                window.appState.timer.isRunning = false;
                updateTimerRunningState(); syncState();
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const modeParam = urlParams.get('mode');
            if (modeParam) { document.getElementById('mode-selector').value = modeParam; changeMode(modeParam); }
            
            try {
                const savedState = localStorage.getItem('obs_score_v2_' + (document.getElementById('input-room-code')?.value || 'liga-match-v2'));
                if (savedState) {
                    const parsed = JSON.parse(savedState);
                    window.appState = { ...window.appState, ...parsed };
                }
            } catch(e) {}

            updateNames(); window.generateOBSLink(); renderDOM(); initSync();
            
            const btnTop = document.getElementById('btn-show-top');
            const btnBtm = document.getElementById('btn-show-bottom');
            if(btnTop) btnTop.className = window.appState.activeView === 'top' ? 'flex-1 btn-pro btn-primary' : 'flex-1 btn-pro btn-outline';
            if(btnBtm) btnBtm.className = window.appState.activeView === 'bottom' ? 'flex-1 btn-pro btn-primary' : 'flex-1 btn-pro btn-outline';
        });
    </script>
</body>
</html>
